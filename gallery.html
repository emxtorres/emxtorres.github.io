<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gallery</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
<style>
.eyebrow{
  font-size:.78rem;
  font-weight:600;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--accent);
  margin:0 0 14px;
}
.lead{
  color:var(--muted);
  font-size:1.05rem;
  line-height:1.6;
  max-width:46ch;
  margin:0;
}
.panel{margin:40px 0 28px}
.input-row{display:flex;gap:10px}
input[type=text]{
  flex:1;
  min-width:0;
  padding:15px 18px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  color:var(--mu);
  font:inherit;
  font-size:.95rem;
}
input[type=text]::placeholder{color:#C7BCB0}
input[type=text]:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.btn{
  font:inherit;
  font-size:.92rem;
  font-weight:500;
  border-radius:12px;
  border:1px solid transparent;
  padding:15px 24px;
  cursor:pointer;
  white-space:nowrap;
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}
.btn-primary{background:var(--mu);color:#fff}
.btn-primary:hover{background:var(--accent)}
.frame{
  border:1px solid var(--line);
  border-radius:20px;
  background:var(--canvas-bg);
  overflow:hidden;
}
svg{display:block;width:100%;height:auto}
.meta-row{
  display:flex;
  flex-wrap:wrap;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  margin-top:24px;
}
.meta{display:flex;gap:32px;flex-wrap:wrap}
.meta-item{font-size:.95rem;color:var(--mu)}
.meta-item b{
  display:block;
  font-size:.68rem;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:600;
  margin-bottom:4px;
}
.exports{display:flex;gap:8px}
.btn-ghost{
  background:#fff;
  border:1px solid var(--line);
  color:var(--mu);
  padding:10px 16px;
  font-size:.85rem;
}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
@media (max-width:560px){
  .input-row{flex-direction:column}
  .meta-row{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>

<nav class="site-nav">

</button>

<script>
  const h=document.documentElement,b=document.getElementById('tb');
  function t(d){d?h.setAttribute('data-dark',''):h.removeAttribute('data-dark');b.textContent=d?'☀':'☽';localStorage.setItem('dark',d)}
  const s=localStorage.getItem('dark');
  t(s!==null?s==='true':window.matchMedia('(prefers-color-scheme:dark)').matches);
  b.onclick=()=>t(!h.hasAttribute('data-dark'));
   const burger = document.getElementById('burger');
const navList = document.querySelector('.nav-links');
burger.addEventListener('click', () => {
  const open = burger.classList.toggle('open');
  navList.classList.toggle('open');
  burger.setAttribute('aria-expanded', open);
});
navList.querySelectorAll('a').forEach(a =>
  a.addEventListener('click', () => {
    burger.classList.remove('open');
    navList.classList.remove('open');
  })
);
</script>
</body>
</html>
